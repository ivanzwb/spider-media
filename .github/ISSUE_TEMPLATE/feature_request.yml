name: ✨ Feature request
description: 提交新功能 / 新平台 / 新模板的设想
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      placeholder: 当前发布到 XX 平台时 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 新平台支持
        - 新样式模板
        - 排版参数
        - 图片 / 图床
        - Mermaid 渲染
        - 嵌入 webview 注入
        - 其他
    validations:
      required: true
